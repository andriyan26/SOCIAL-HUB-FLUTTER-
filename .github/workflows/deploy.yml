name: Deploy Flutter Web to GitHub Pages & Package Hostinger Bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web (GitHub Pages)
        run: |
          mkdir -p build/web
          flutter build web --release --base-href "/SOCIAL-HUB-FLUTTER-/" --pwa-strategy=none --verbose > build_verbose.log 2>&1 || BUILD_FAILED=1
          if [ "$BUILD_FAILED" = "1" ]; then
            echo "=== FLUTTER BUILD ERROR LOG ==="
            tail -n 120 build_verbose.log
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-log
            git add -f build_verbose.log
            git commit -m "chore: save build failure log" || true
            git push -f origin build-log || true
            exit 1
          fi

      - name: Prepare Hostinger public_html Bundle
        run: |
          mkdir -p build/hostinger
          cp -r build/web/* build/hostinger/
          # Replace base-href for Hostinger root domain
          sed -i 's|<base href="/SOCIAL-HUB-FLUTTER-/">|<base href="/">|g' build/hostinger/index.html
          # Copy backend API, uploads structure, .htaccess, and SQL
          cp -r api build/hostinger/
          cp .htaccess build/hostinger/
          cp socialhub.sql build/hostinger/
          mkdir -p build/hostinger/uploads/videos build/hostinger/uploads/images
          echo "<!DOCTYPE html><html><body>Access Denied</body></html>" > build/hostinger/uploads/index.html
          # Create zip file
          cd build/hostinger && zip -r ../../public_html.zip . && cd ../..

      - name: Upload Hostinger ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-public_html-zip
          path: public_html.zip
          retention-days: 14

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
